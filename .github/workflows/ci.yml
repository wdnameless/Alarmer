name: CI

on:
  push:
    branches: [master]
  pull_request:

# Both halves of the product are gated: the webview is checked by tsc/eslint/
# vitest, and the scheduler — where alarm correctness actually lives — by cargo.
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Enforces the coverage floors in vitest.config.ts. Both P0 defects this
      # project shipped lived in untested component lifecycle, so the gate is a
      # ratchet against that specific gap reopening.
      - run: bun run test:coverage

  backend:
    # The scheduler derives local time from the Windows timezone API, so the
    # backend is exercised on the platform it actually ships to.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
