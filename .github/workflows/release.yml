name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Builds the app for all three desktop platforms and publishes a draft GitHub
# Release with installers plus a portable bundle per platform.
jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            exeName: alarmer.exe
          - os: macos-latest
            platform: macos
            exeName: alarmer
          - os: ubuntu-latest
            platform: linux
            exeName: alarmer

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # Linux needs the WebKit/WebKitGTK stack to build, plus ALSA headers:
      # `rodio` links `alsa-sys` for the alarm sound the backend plays when the
      # window is hidden, and that crate will not build without `alsa.pc`.
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libasound2-dev

      # Build only: publishing is handled once, after every platform has built.
      # `tauri-action` tried to create and then edit the same release from three
      # jobs at once, and against an already-published release it fails with
      # "Resource not accessible by integration" — after a successful build.
      - name: Build
        run: bun run tauri build

      # A portable bundle is the built binary plus an empty `portable` marker:
      # the app sees the marker and keeps its data beside itself rather than in
      # the per-user application data directory. No installer, no registry.
      #
      # `zip` is not present on Windows runners, so the archive is written with
      # PowerShell there and with `zip` elsewhere.
      - name: Build portable bundle
        shell: pwsh
        run: |
          $name = "alarmer-${{ github.ref_name }}-portable-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path portable/alarmer | Out-Null
          Copy-Item "src-tauri/target/release/${{ matrix.exeName }}" "portable/alarmer/${{ matrix.exeName }}"
          New-Item -ItemType File -Force -Path portable/alarmer/portable | Out-Null
          Compress-Archive -Path portable/alarmer -DestinationPath "$name.zip" -Force
          Write-Host "built $name.zip"

      # Collect every artifact this platform produced, so the publish job has
      # them all in one place.
      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alarmer-${{ matrix.platform }}
          path: |
            alarmer-${{ github.ref_name }}-portable-${{ matrix.platform }}.zip
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: warn

  # One job owns the release, so three parallel builds cannot race to edit it.
  publish:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          fail_on_unmatched_files: false
